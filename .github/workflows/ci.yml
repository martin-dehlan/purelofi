name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env is git-ignored but declared as an asset, so the bundle needs it
      # to exist. The example values are empty — no secrets in CI.
      - name: Create .env
        run: cp .env.example .env

      # Generated files are not committed.
      - name: Generate code
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
